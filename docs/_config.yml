---
plugins:
  - sleeping_king_studios/docs/jekyll/plugins/required
collections:
  classes:
    output: false
  constants:
    output: false
  methods:
    output: false
  modules:
    output: false
  namespaces:
    output: false
  versions:
    output: false
defaults:
- scope:
    path: ''
    type: 'pages'
  values:
    encoding: 'utf-8'
    layout: 'page'
    title: 'SleepingKingStudios::Docs'
exclude:
  - /vendor
markdown: kramdown

# Project Configuration
project_metadata:
  description: |
    An opinionated implementation of the Command pattern for Ruby applications.
    Cuprum wraps your business logic in a consistent, object-oriented interface
    and features status and error management, composability and control flow
    management.
  name:           Cuprum
  repository_url: https://github.com/sleepingkingstudios/cuprum

# Theme Configuration
theme: jekyll-theme-dinky
description: |
  An opinionated implementation of the Command pattern for Ruby applications.
  Cuprum wraps your business logic in a consistent, object-oriented interface
  and features status and error management, composability and control flow
  management.
github:
  repository_url: https://github.com/sleepingkingstudios/cuprum
title: 'Cuprum'

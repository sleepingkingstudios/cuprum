---
name: Cuprum::Error#initialize
parent_path: cuprum/error
signature: 'initialize(backtrace: false, message: nil, type: nil, **properties)'
slug: initialize
constructor: true
data_path: cuprum/error/i-initialize
params:
- description: |-
    if true, captures a backtrace from
    Kernel.caller. Defaults to false unless the
    ENV['CUPRUM_ERROR_BACKTRACE'] flag is set to true.
  name: backtrace
  type:
  - name: 'true'
  - name: 'false'
  default: 'false'
- description: |-
    Optional message describing the nature of the
    error.
  name: message
  type:
  - name: String
  default: nil
- description: Additional properties used to compare errors.
  name: properties
  type:
  - name: Hash
- description: Short string used to identify the type of error.
  name: type
  type:
  - name: String
  default: nil
returns:
- description: a new instance of Error
  type:
  - name: Error
version: "*"
checksum: carkDrCSbzKEUD3b3dPRow==
